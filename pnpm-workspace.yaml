allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@nuxt/content@3.14.0'
  - '@nuxt/kit@4.4.6'
  - '@nuxt/nitro-server@4.4.6'
  - '@nuxt/schema@4.4.6'
  - '@nuxt/vite-builder@4.4.6'
  - isomorphic-git@1.38.1
  - nuxt@4.4.6
  - '@nuxt/image@2.1.0'
  - '@vueuse/core@14.4.0'
  - '@vueuse/metadata@14.4.0'
  - '@vueuse/shared@14.4.0'
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
